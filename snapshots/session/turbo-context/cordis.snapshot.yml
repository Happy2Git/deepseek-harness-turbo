# Replay the unconfigured Turbo route without network requests.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- id: compaction-basic
  disabled: true
- id: command-compact
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: first-search
    tokenize: trigram
- insert:
    - id: turbo-context-window
      name: '@deepseek-ai/dsh-tool-session-query/turbo-context'
    - id: turbo-history-tools
      name: '@deepseek-ai/dsh-tool-session-query'

- insert:
    - id: turbo-snapshot-clock
      name: ./fixed-clock.mjs
